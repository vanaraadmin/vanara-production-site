    :root {
      color-scheme: dark;
      --forest: #10291f;
      --forest-deep: #081a13;
      --cream: #f7f3ea;
      --gold: #c4a16a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      color: var(--cream);
      background:
        radial-gradient(circle at 50% 15%, rgba(196, 161, 106, 0.16), transparent 34%),
        linear-gradient(145deg, var(--forest), var(--forest-deep));
      font-family: "Lato", sans-serif;
      text-align: center;
    }

    main {
      width: min(640px, 100%);
    }

    .mark {
      display: inline-block;
      margin-bottom: 28px;
      color: var(--gold);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Marcellus", serif;
      font-size: clamp(3rem, 10vw, 6.5rem);
      font-weight: 400;
      line-height: 0.98;
    }

    p {
      max-width: 520px;
      margin: 28px auto 0;
      color: rgba(247, 243, 234, 0.76);
      font-size: 1.05rem;
      font-weight: 300;
      line-height: 1.8;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      margin-top: 36px;
      padding: 0 28px;
      border: 1px solid rgba(196, 161, 106, 0.72);
      border-radius: 999px;
      color: var(--cream);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
      transition: background-color 180ms ease, color 180ms ease;
    }

    a:hover,
    a:focus-visible {
      color: var(--forest-deep);
      background: var(--gold);
      outline: none;
    }
  </style>
